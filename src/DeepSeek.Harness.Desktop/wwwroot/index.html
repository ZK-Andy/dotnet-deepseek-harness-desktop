<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness Desktop</title>
    <style>
        /* 壳自有页面在 dsh Web 层加载前渲染，拿不到 dsh 主题 CSS——采用官方 boot-page 同款
           回退策略（deepseek-harness packages/client/web/src/boot-page.module.css）：本地
           调色板亮色为基、暗色经 prefers-color-scheme 覆盖，墨色单色系 + 语义色点缀；
           语义色取值与 companion（--dsw-alias-state-success/error-primary）同源。 */
        :root {
            color-scheme: light dark;
            --dshdt-label-primary: #0f1115;
            --dshdt-label-secondary: #61666b;
            --dshdt-label-tertiary: #81858c;
            --dshdt-border: rgb(0 0 0 / 10%);
            --dshdt-brand: #0f1115;
            --dshdt-surface: rgb(0 0 0 / 4%);
            --dshdt-success: #15803d;
            --dshdt-error: #dc2626;
            --dshdt-error-bg: rgb(220 38 38 / 6%);
            --dshdt-error-border: rgb(220 38 38 / 25%);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --dshdt-label-primary: #f9fafb;
                --dshdt-label-secondary: #cfd3d6;
                --dshdt-label-tertiary: #adb2b8;
                --dshdt-border: rgb(255 255 255 / 12%);
                --dshdt-brand: #f9fafb;
                --dshdt-surface: rgb(255 255 255 / 6%);
                --dshdt-success: #22c55e;
                --dshdt-error: #ef4444;
                --dshdt-error-bg: rgb(239 68 68 / 10%);
                --dshdt-error-border: rgb(239 68 68 / 35%);
            }
        }
        /* —— 无边框窗口 chrome（ADR frameless-uniform-caption-bar）——
           与 PageBridge.CaptionBar 注入同 id 同规格：macOS 红绿灯三点（1 6px 起、18px 下、12px 圆点），
           本页是壳自有引导页（无 dsh 侧栏可让位），自带 52px 顶部让位。 */
        body { padding-top: 52px; }
        #dsh-desktop-caption-bar {
            position: fixed; top: 0; left: 0; height: 52px;
            display: flex; align-items: flex-start; gap: 8px; padding: 18px 0 0 16px;
            z-index: 2147483647;
        }
        #dsh-desktop-caption-bar button {
            width: 12px; height: 12px; border: 0; padding: 0; border-radius: 50%;
            position: relative; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgb(0 0 0 / 12%);
        }
        #dsh-desktop-caption-bar button[data-webview-close] { background: #ff5f57; }
        #dsh-desktop-caption-bar button[data-webview-minimize] { background: #febc2e; }
        #dsh-desktop-caption-bar button[data-webview-maximize] { background: #28c840; }
        #dsh-desktop-caption-bar button svg {
            display: none; width: 6px; height: 6px; color: rgb(0 0 0 / 55%);
        }
        #dsh-desktop-caption-bar button:hover svg { display: block; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: Canvas; color: var(--dshdt-label-primary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; gap: 16px; text-align: center;
        }
        /* wordmark 沿官方 boot 页规格：16px/600 + 字距 */
        h1 { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0.08em; color: var(--dshdt-label-primary); }
        p { color: var(--dshdt-label-tertiary); max-width: 520px; line-height: 1.6; font-size: 13px; }
        code { background: var(--dshdt-surface); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        /* —— 首启引导（ADR online-first-unbundled-runtime）—— */
        #bootstrap { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: 560px; }
        #bootstrap.visible { display: flex; }
        .step { display: flex; align-items: center; gap: 10px; color: var(--dshdt-label-secondary); font-size: 13px; }
        .step .dot {
            width: 8px; height: 8px; border-radius: 50%; flex: none;
            background: var(--dshdt-border); transition: background 0.3s;
        }
        .step.active { color: var(--dshdt-label-primary); }
        .step.active .dot { background: var(--dshdt-brand); animation: pulse 1.2s ease-in-out infinite; }
        .step.done { color: var(--dshdt-label-secondary); }
        .step.done .dot { background: var(--dshdt-success); animation: none; }
        .step.failed { color: var(--dshdt-error); }
        .step.failed .dot { background: var(--dshdt-error); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #bootError {
            display: none; color: var(--dshdt-error); background: var(--dshdt-error-bg);
            border: 1px solid var(--dshdt-error-border);
            border-radius: 8px; padding: 10px 16px; max-width: 520px; word-break: break-all;
            font-size: 12px; line-height: 1.6;
        }
        #bootError.visible { display: block; }
        /* 按钮主态 = 反色填充（与 companion 设置页 .ovn-btn 同规格），次态 = 描边幽灵 */
        #bootRetry {
            display: none; background: var(--dshdt-label-primary); color: Canvas;
            border: 1px solid transparent; border-radius: 8px;
            padding: 8px 24px; font-size: 13px; line-height: 1.5; cursor: pointer;
        }
        #bootRetry.visible { display: inline-block; }
        #bootRetry:hover { opacity: 0.92; }
        .spinner {
            position: relative; width: 20px; height: 20px; display: none;
            border: 2px solid var(--dshdt-border); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner.visible { display: block; }
        .spinner::after {
            content: ''; position: absolute; inset: -2px; border-radius: inherit;
            background: conic-gradient(var(--dshdt-brand) 72deg, transparent 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="dsh-desktop-caption-bar">
        <button data-webview-close aria-label="关闭" data-i18n-aria="capClose"><svg viewBox="0 0 6 6"><path d="M0.5 0.5l5 5M5.5 0.5l-5 5" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
        <button data-webview-minimize aria-label="最小化" data-i18n-aria="capMinimize"><svg viewBox="0 0 6 6"><path d="M0.5 3h5" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
        <button data-webview-maximize aria-label="最大化" data-i18n-aria="capMaximize"><svg viewBox="0 0 6 6"><path d="M3.8 0.5h1.7v1.7M2.2 5.5H0.5V3.8M5.5 0.5L3.5 2.5M0.5 5.5l2-2" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
    </div>
    <h1>DeepSeek Harness Desktop</h1>
    <div id="bootstrap">
        <div class="spinner visible" id="bootSpinner"></div>
        <div id="bootSteps">
            <div class="step" data-step="EnsureNode"><span class="dot"></span><span data-i18n="stepEnsureNode">确保系统全局 Node</span></div>
            <div class="step" data-step="InstallDsh"><span class="dot"></span><span data-i18n="stepInstallDsh">npm 安装全局 dsh（需联网）</span></div>
            <div class="step" data-step="VerifyDsh"><span class="dot"></span><span data-i18n="stepVerifyDsh">验证 dsh 版本</span></div>
        </div>
        <div id="bootError"></div>
        <button id="bootRetry" onclick="retryBootstrap()" data-i18n="retry">重试</button>
    </div>
    <p id="fallbackText"><span data-i18n="fallbackText">运行时未就绪（</span><code>dsh web</code> <span data-i18n="fallbackTextTail">未在时限内给出 URL）。</span></p>
    <p id="fallbackHint"><span data-i18n="fallbackHint">请检查</span> <code>DEEPSEEK_API_KEY</code> <span data-i18n="fallbackHintTail">与日志，或重启应用。</span></p>
    <script>
        // 宿主 UI 语言（UiLocale）：页面在 dsh 启动前渲染，语言只能由宿主给（拉取而非推送，避免注入时序竞态）
        // 七种非中文语言的静态文案；zh 走上方内联节点（不设 D.zh 副本）。
        // verify-ui-copy 核对：语言闭集、键集跨语言全等、节点⇄表键双向覆盖、译文非空。
        var D = {
            en: {
                stepEnsureNode: 'Ensure system-global Node',
                stepInstallDsh: 'Install global dsh via npm (network required)',
                stepVerifyDsh: 'Verify dsh version',
                retry: 'Retry',
                fallbackText: 'Runtime not ready (',
                fallbackTextTail: 'did not yield a URL in time).',
                fallbackHint: 'Check',
                fallbackHintTail: 'and the logs, or restart the app.',
                capMinimize: 'Minimize',
                capMaximize: 'Maximize',
                capClose: 'Close',
            },
            ja: {
                stepEnsureNode: 'システムグローバルの Node を確認',
                stepInstallDsh: 'npm でグローバル dsh をインストール（ネットワーク必須）',
                stepVerifyDsh: 'dsh バージョンを確認',
                retry: '再試行',
                fallbackText: 'ランタイムの準備ができていません（',
                fallbackTextTail: '時間内に URL が返されませんでした）。',
                fallbackHint: '確認してください：',
                fallbackHintTail: 'とログ。またはアプリを再起動してください。',
                capMinimize: '最小化',
                capMaximize: '最大化',
                capClose: '閉じる',
            },
            es: {
                stepEnsureNode: 'Asegurar Node global del sistema',
                stepInstallDsh: 'Instalar dsh global con npm (requiere red)',
                stepVerifyDsh: 'Verificar la versión de dsh',
                retry: 'Reintentar',
                fallbackText: 'Tiempo de ejecución no listo (',
                fallbackTextTail: 'no devolvió una URL a tiempo).',
                fallbackHint: 'Compruebe',
                fallbackHintTail: 'y los registros, o reinicie la aplicación.',
                capMinimize: 'Minimizar',
                capMaximize: 'Maximizar',
                capClose: 'Cerrar',
            },
            fr: {
                stepEnsureNode: 'Garantir Node global du système',
                stepInstallDsh: 'Installer dsh global via npm (réseau requis)',
                stepVerifyDsh: 'Vérifier la version de dsh',
                retry: 'Réessayer',
                fallbackText: 'L\'exécution n\'est pas prête (',
                fallbackTextTail: 'n\'a pas fourni d\'URL à temps).',
                fallbackHint: 'Vérifiez',
                fallbackHintTail: 'et les journaux, ou redémarrez l’application.',
                capMinimize: 'Réduire',
                capMaximize: 'Agrandir',
                capClose: 'Fermer',
            },
            de: {
                stepEnsureNode: 'Systemweites Node sicherstellen',
                stepInstallDsh: 'Globales dsh via npm installieren (Netzwerk erforderlich)',
                stepVerifyDsh: 'dsh-Version prüfen',
                retry: 'Erneut versuchen',
                fallbackText: 'Laufzeit nicht bereit (',
                fallbackTextTail: 'hat nicht rechtzeitig eine URL geliefert).',
                fallbackHint: 'Prüfen Sie',
                fallbackHintTail: 'und die Protokolle, oder starten Sie die App neu.',
                capMinimize: 'Minimieren',
                capMaximize: 'Maximieren',
                capClose: 'Schließen',
            },
            ru: {
                stepEnsureNode: 'Обеспечить системный Node',
                stepInstallDsh: 'Установить глобальный dsh через npm (требуется сеть)',
                stepVerifyDsh: 'Проверить версию dsh',
                retry: 'Повторить',
                fallbackText: 'Среда выполнения не готова (',
                fallbackTextTail: 'не выдала URL вовремя).',
                fallbackHint: 'Проверьте',
                fallbackHintTail: 'и журналы, либо перезапустите приложение.',
                capMinimize: 'Свернуть',
                capMaximize: 'Развернуть',
                capClose: 'Закрыть',
            },
            pt: {
                stepEnsureNode: 'Garantir Node global do sistema',
                stepInstallDsh: 'Instalar dsh global via npm (requer rede)',
                stepVerifyDsh: 'Verificar a versão do dsh',
                retry: 'Tentar novamente',
                fallbackText: 'Tempo de execução não está pronto (',
                fallbackTextTail: 'não retornou uma URL a tempo).',
                fallbackHint: 'Verifique',
                fallbackHintTail: 'e os logs, ou reinicie o aplicativo.',
                capMinimize: 'Minimizar',
                capMaximize: 'Maximizar',
                capClose: 'Fechar',
            },
        };
        // 「没有 locale 来源」的规范形态：宿主回包缺失或为空白时用这里。取值与原生壳
        // UiLanguageResolver.NoSourceLocale 同一个（页面不能引用 C# 常量，只能两侧互相锚定）。
        // 注意与「有值但语言未注册」（→ en，上游 FALLBACK_LOCALE 同向）是两种情形，别合并。
        var NO_SOURCE_LOCALE = 'zh-CN';
        function applyLocale(locale) {
            // 主语言子标签定表；未注册语言回落 en（与原生壳 UiLanguageResolver 同向，
            // ADR ui-copy-eight-locales）。分隔符与原生壳一致地认 -、_、.（POSIX 形态
            // zh_CN.UTF-8 若原样到这里，只按 '-' 切会把整串当主标签、连带把中文用户甩到英文）。
            // zh 走 zh-CN，其余写回各自的 BCP 47 主标签。
            var raw = locale == null ? '' : String(locale).trim();
            var primary = (raw || NO_SOURCE_LOCALE).toLowerCase().split(/[-_.]/)[0];
            var table = D[primary] || D.en;
            var isZh = primary === 'zh';
            document.documentElement.lang = isZh ? 'zh-CN' : (D[primary] ? primary : 'en');
            if (isZh) { return; }
            var nodes = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < nodes.length; i++) {
                var key = nodes[i].getAttribute('data-i18n');
                if (table[key]) { nodes[i].textContent = table[key]; }
            }
            var ariaNodes = document.querySelectorAll('[data-i18n-aria]');
            for (var j = 0; j < ariaNodes.length; j++) {
                var ariaKey = ariaNodes[j].getAttribute('data-i18n-aria');
                if (table[ariaKey]) { ariaNodes[j].setAttribute('aria-label', table[ariaKey]); }
            }
        }
        // 语言未定前的宿主帧先入队：applyLocale 只改静态节点，若进度帧先到会停在中文而与静态文案混排；
        // 语言落定后按到达序回放。1s 兜底防宿主不回包时卡帧。
        var localeReady = false;
        var pendingFrames = [];
        function releaseFrames() {
            if (localeReady) { return; }
            localeReady = true;
            var queued = pendingFrames;
            pendingFrames = [];
            for (var i = 0; i < queued.length; i++) { handleFrame(queued[i]); }
        }
        function handleFrame(detail) {
            if (!localeReady) { pendingFrames.push(detail); return; }
            try {
                renderBootstrap(detail || {});
            } catch (e) { /* 渲染失败不影响宿主引导链路 */ }
        }
        setTimeout(releaseFrames, 1000);
        // 桥在 NavigationCompleted 后才注入（无 document-start 钩子），首屏只能轮询等它出现；
        // 2s 内没等到就按「宿主未接命令」退化（保持中文并放行已排队帧）。
        function withShell(fn) {
            var tries = 0;
            (function attempt() {
                if (window.__shell && window.__shell.invoke) { fn(window.__shell); return; }
                if (++tries > 40) { releaseFrames(); return; }
                setTimeout(attempt, 50);
            })();
        }
        withShell(function (shell) {
            shell.invoke('desktop.ui.getLocale', {}).then(function (r) { applyLocale(r && r.locale); })
                .catch(function () { /* 宿主未接命令：保持中文 */ })
                .then(releaseFrames);
        });

        // 首启引导状态机渲染（ADR simple-shell-single-global-dsh）：宿主经 CustomEvent 推进度，
        // 数据一律 textContent 回填（stderr/错误信息是上游不可控输出，绝不 innerHTML 拼接）。
        var STEP_ORDER = ['EnsureNode', 'InstallDsh', 'VerifyDsh'];

        function renderBootstrap(detail) {
            document.getElementById('bootstrap').classList.add('visible');
            document.getElementById('fallbackText').style.display = 'none';
            document.getElementById('fallbackHint').style.display = 'none';
            var failed = detail.failed === true;
            var ready = detail.step === 'Ready';
            document.getElementById('bootSpinner').classList.toggle('visible', !failed && !ready);
            var idx = STEP_ORDER.indexOf(detail.step);
            var steps = document.querySelectorAll('#bootSteps .step');
            steps.forEach(function (el, i) {
                el.classList.remove('active', 'done', 'failed');
                if (failed && i === idx) { el.classList.add('failed'); return; }
                if (idx < 0 || i < idx || (ready && i <= idx)) { el.classList.add('done'); }
                else if (i === idx && !ready) { el.classList.add('active'); }
            });
            var errBox = document.getElementById('bootError');
            if (failed && detail.message) {
                errBox.textContent = detail.message;
                errBox.classList.add('visible');
            } else {
                errBox.classList.remove('visible');
            }
            document.getElementById('bootRetry').classList.toggle('visible', failed);
        }

        function retryBootstrap() {
            try {
                window.__shell.invoke('desktop.bootstrap.retry', {}).catch(function () {
                    /* 宿主暂未接该命令（G3 前）：用户可再点一次；不产生未处理 rejection */
                });
            } catch (e) { /* 桥未就绪时静默 */ }
        }

        document.addEventListener('dsh-desktop-bootstrap', function (ev) {
            handleFrame(ev.detail || {});
        });
    </script>
</body>
</html>
