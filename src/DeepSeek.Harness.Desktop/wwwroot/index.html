<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness Desktop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: #0f0f13; color: #e6e6ea;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; gap: 16px; text-align: center;
        }
        h1 { font-size: 1.8em; color: #7c3aed; }
        p { color: #a1a1b5; max-width: 520px; line-height: 1.6; }
        code { background: #1a1a24; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        /* —— 首启引导（ADR online-first-unbundled-runtime）—— */
        #bootstrap { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: 560px; }
        #bootstrap.visible { display: flex; }
        .step { display: flex; align-items: center; gap: 10px; color: #a1a1b5; font-size: 0.95em; }
        .step .dot {
            width: 10px; height: 10px; border-radius: 50%; flex: none;
            background: #2a2a38; transition: background 0.3s;
        }
        .step.active { color: #e6e6ea; }
        .step.active .dot { background: #7c3aed; animation: pulse 1.2s ease-in-out infinite; }
        .step.done { color: #6ee7a0; }
        .step.done .dot { background: #22c55e; animation: none; }
        .step.failed { color: #ff8f8f; }
        .step.failed .dot { background: #ef4444; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #bootError {
            display: none; color: #ff8f8f; background: #2a1414; border: 1px solid #5a2a2a;
            border-radius: 8px; padding: 10px 16px; max-width: 520px; word-break: break-all;
            font-size: 0.9em; line-height: 1.5;
        }
        #bootError.visible { display: block; }
        #bootRetry {
            display: none; background: #7c3aed; color: #fff; border: none; border-radius: 8px;
            padding: 10px 32px; font-size: 1em; cursor: pointer;
        }
        #bootRetry.visible { display: inline-block; }
        #bootRetry:hover { background: #8b5cf6; }
        .spinner {
            width: 28px; height: 28px; border: 3px solid #2a2a38; border-top-color: #7c3aed;
            border-radius: 50%; animation: spin 0.9s linear infinite; display: none;
        }
        .spinner.visible { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* —— 插件引导（ADR reference-alignment 批次二）—— */
        #preinstall { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: 560px; }
        #preinstall.visible { display: flex; }
        #preinstall h2 { font-size: 1.2em; color: #e6e6ea; }
        #preinstall p { color: #a1a1b5; max-width: 480px; font-size: 0.9em; }
        #preinstallChips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .chip {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; color: #e6e6ea;
            font-size: 0.92em; cursor: pointer;
        }
        .chip input { accent-color: #7c3aed; }
        #preinstallActions { display: flex; gap: 12px; }
        #preinstallActions button {
            background: #7c3aed; color: #fff; border: none; border-radius: 8px;
            padding: 10px 28px; font-size: 1em; cursor: pointer;
        }
        #preinstallActions button:hover { background: #8b5cf6; }
        #preinstallActions button:disabled { opacity: 0.5; cursor: default; }
        #preinstallActions .ghost { background: #2a2a38; }
        #preinstallActions .ghost:hover { background: #3a3a48; }
        #preinstallLog {
            display: none; width: 100%; max-height: 180px; overflow-y: auto; text-align: left;
            background: #0a0a10; border: 1px solid #2a2a38; border-radius: 8px; padding: 10px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82em;
            color: #a1a1b5; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
        }
        #preinstallLog.visible { display: block; }
        #preinstallLog pre { margin: 0; }
    </style>
</head>
<body>
    <h1>DeepSeek Harness Desktop</h1>
    <div id="bootstrap">
        <div class="spinner visible" id="bootSpinner"></div>
        <div id="bootSteps">
            <div class="step" data-step="EnsureNode"><span class="dot"></span><span>确保系统全局 Node</span></div>
            <div class="step" data-step="InstallDsh"><span class="dot"></span><span>npm 安装全局 dsh（需联网）</span></div>
            <div class="step" data-step="VerifyDsh"><span class="dot"></span><span>验证 dsh 版本</span></div>
            <div class="step" data-step="PreinstallPlugins"><span class="dot"></span><span>插件准备</span></div>
        </div>
        <div id="preinstall">
            <h2>可选插件</h2>
            <p>以下插件为 DeepSeek Harness 桌面体验提供增强，可自由选择安装（跳过仍可稍后在应用内补装）：</p>
            <div id="preinstallChips"></div>
            <div id="preinstallActions">
                <button id="preinstallConfirm" onclick="preinstallChoose('install')">确认安装</button>
                <button id="preinstallSkip" class="ghost" onclick="preinstallChoose('skip')">跳过</button>
            </div>
            <div id="preinstallLog"></div>
        </div>
        <div id="bootError"></div>
        <button id="bootRetry" onclick="retryBootstrap()">重试</button>
    </div>
    <p id="fallbackText">运行时未就绪（<code>dsh web</code> 未在时限内给出 URL）。</p>
    <p id="fallbackHint">请检查 <code>DEEPSEEK_API_KEY</code> 与日志，或重启应用。</p>
    <script>
        // 首启引导状态机渲染（ADR simple-shell-single-global-dsh）：宿主经 CustomEvent 推进度，
        // 数据一律 textContent 回填（stderr/错误信息是上游不可控输出，绝不 innerHTML 拼接）。
        var STEP_ORDER = ['EnsureNode', 'InstallDsh', 'VerifyDsh', 'PreinstallPlugins'];

        function renderBootstrap(detail) {
            document.getElementById('bootstrap').classList.add('visible');
            document.getElementById('fallbackText').style.display = 'none';
            document.getElementById('fallbackHint').style.display = 'none';
            var failed = detail.failed === true;
            var ready = detail.step === 'Ready';
            document.getElementById('bootSpinner').classList.toggle('visible', !failed && !ready);
            var idx = STEP_ORDER.indexOf(detail.step);
            var steps = document.querySelectorAll('#bootSteps .step');
            steps.forEach(function (el, i) {
                el.classList.remove('active', 'done', 'failed');
                if (failed && i === idx) { el.classList.add('failed'); return; }
                if (idx < 0 || i < idx || (ready && i <= idx)) { el.classList.add('done'); }
                else if (i === idx && !ready) { el.classList.add('active'); }
            });
            var errBox = document.getElementById('bootError');
            if (failed && detail.message) {
                errBox.textContent = detail.message;
                errBox.classList.add('visible');
            } else {
                errBox.classList.remove('visible');
            }
            document.getElementById('bootRetry').classList.toggle('visible', failed);
        }

        function retryBootstrap() {
            try { window.__ryn.invoke('desktop.bootstrap.retry', {}); } catch (e) { /* IPC 未就绪时静默 */ }
        }

        // —— 插件引导（ADR reference-alignment 批次二）——
        // 宿主经 dsh-desktop-preinstall CustomEvent 推 decision/installing/log/done；
        // 日志一律 textContent 回填（plugin add 输出是上游不可控文本，绝不 innerHTML 拼接）。
        var PLUGIN_NAMES = { dshmarket: '插件市场（dshmarket）' };

        function preinstallChoose(action) {
            try { window.__ryn.invoke('desktop.preinstall.choose', { action: action }); } catch (e) { /* IPC 未就绪时静默 */ }
            setPreinstallActions(false);
            appendPreinstallLog(action === 'install' ? '正在安装…' : '已跳过可选插件');
        }

        function renderPreinstall(detail) {
            var kind = detail.kind;
            if (kind === 'decision') {
                var box = document.getElementById('preinstall');
                box.classList.add('visible');
                document.getElementById('bootSpinner').classList.remove('visible');
                renderPreinstallChips(detail.plugins || []);
                setPreinstallActions(true);
            } else if (kind === 'installing') {
                setPreinstallActions(false);
                var pn = PLUGIN_NAMES[detail.plugin] || detail.plugin || '插件';
                appendPreinstallLog('正在安装 ' + pn + ' …');
            } else if (kind === 'log') {
                appendPreinstallLog(detail.line);
            } else if (kind === 'done') {
                setPreinstallActions(false);
                appendPreinstallLog(detail.message || (detail.action === 'skip' ? '已跳过插件安装' : '安装完成'));
            }
        }

        function renderPreinstallChips(plugins) {
            var chips = document.getElementById('preinstallChips');
            chips.innerHTML = '';
            plugins.forEach(function (p) {
                var label = PLUGIN_NAMES[p] || p;
                var chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = '推荐 · ' + label;
                chips.appendChild(chip);
            });
        }

        function setPreinstallActions(enabled) {
            document.getElementById('preinstallConfirm').disabled = !enabled;
            document.getElementById('preinstallSkip').disabled = !enabled;
        }

        function appendPreinstallLog(line) {
            var log = document.getElementById('preinstallLog');
            log.classList.add('visible');
            var pre = document.createElement('pre');
            pre.textContent = line;
            log.appendChild(pre);
            log.scrollTop = log.scrollHeight;
        }

        document.addEventListener('dsh-desktop-bootstrap', function (ev) {
            try { renderBootstrap(ev.detail || {}); } catch (e) { /* 渲染失败不影响宿主引导链路 */ }
        });

        document.addEventListener('dsh-desktop-preinstall', function (ev) {
            try { renderPreinstall(ev.detail || {}); } catch (e) { /* 渲染失败不影响宿主引导链路 */ }
        });
    </script>
</body>
</html>
