name: Bug Report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: 负责人（@提及）
      placeholder: "@ZK-Andy"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3]
      default: 1
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Class
      description: 分类
      options: [bug-fix, feature, architecture, testing, process]
      default: 0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 现象、复现步骤、期望 vs 实际
      placeholder: "1. 启动… 2. 点击… 3. 期望… 实际…"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: 版本/系统/运行时
      placeholder: "v0.1.12, Fedora 40, .NET 10, WebKitGTK 6"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: 相关日志或截图（脱敏）
