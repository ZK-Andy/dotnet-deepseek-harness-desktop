name: release

# 统一发布：tag v*（自动）触发，聚合三平台产物 + 生成结构化双语正文 + 合并 SHA256SUMS + 创建单个 Release。
# 单一 owner —— 修复旧方案（linux/macos/windows 各自 publish-release 都开 generate_release_notes
# 并行写正文，导致 body 重复 N 次）的重复与竞争。
# tag 命名保持 v0.1.x；后缀含 rc/beta/alpha（如 v1.2.0-rc.1、v1.2.0rc1）的 tag 标 prerelease。
#
# 竞态防护：本 workflow 与三个 package workflow 因同一 tag 并行触发，先「等待三平台产物就绪」
# （按 workflow_run.head_sha 关联到本次 tag 构建轮询），避免产物未上传就下载空包。
# 亦支持 workflow_dispatch 手动触发（三平台产物已备时）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史 + tags，供 release-notes.sh 生成 compare 与分类
          persist-credentials: false

      - name: 等待三平台产物就绪（本 tag 构建）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          jq_filter="[.artifacts[]|select(.expired==false and (.workflow_run.head_sha==\"$sha\"))|.name]|join(\" \")"
          runs_jq="[.workflow_runs[]|select(.path|test(\"package-(linux|macos|windows)\"))|\"\(.path) \(.conclusion // \"running\")\"]|join(\"; \")"
          # 失败快速逃逸：产物判定只认「存在性」，平台 job 失败时产物永不出现，旧逻辑会把失败
          # 当「还没好」空转满 25m 才报笼统超时（v0.3.12 首发实证）。任一平台 run 已失败即终止。
          check_failed_runs() {
            local status
            status="$(gh api "repos/$repo/actions/runs?head_sha=$sha&per_page=30" --jq "$runs_jq" 2>/dev/null || true)"
            if grep -qE '(failure|cancelled|startup_failure|timed_out)' <<< "$status"; then
              echo "error: 平台构建失败——[$status]；先修平台构建再重发（勿人工绕过）" >&2
              exit 1
            fi
          }
          check_failed_runs
          for i in $(seq 1 150); do
            resp="$(gh api "repos/$repo/actions/artifacts?per_page=100" --jq "$jq_filter" 2>/dev/null || true)"
            ok=1
            # 六资产必须逐一就绪——v0.4.0 首发实锤：linux- 宽松通配在 amd64 就绪即放行，
            # 而 arm64 leg 在慢 runner 上载较晚被漏 → preflight 缺 linux-arm64/aarch64（release 失败）。
            # 改逐名精确判定；tag 构建产物恒为列表最新（首 100 内），无需分页。
            for want in linux-amd64-packages linux-arm64-packages macos-arm64-packages macos-x64-packages windows-x64-packages; do
              [[ " $resp " == *" $want "* ]] || ok=0
            done
            if [[ "$ok" == 1 ]]; then echo "三平台产物就绪: $resp"; exit 0; fi
            check_failed_runs
            echo "等待三平台产物（$((i*10))s / ~25m）：$resp"
            sleep 10
          done
          echo "error: 等待三平台产物超时" >&2; exit 1

      - name: 下载三平台产物（跨 run，经 API）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"; sha="$GITHUB_SHA"
          mkdir -p release-assets
          # download-artifact@v4 只能拉当前 run 的产物；三平台产物在其它 workflow run，
          # 故经 API 按 workflow_run.head_sha（= 本次 tag 构建）跨 run 逐一拉取解压。
          jq_urls="[.artifacts[]|select(.expired==false and (.workflow_run.head_sha==\"$sha\") and (.name|test(\"-packages$\")))|{name,url:.archive_download_url}]"
          gh api "repos/$repo/actions/artifacts?per_page=100" --jq "$jq_urls" > /tmp/arts.json
          GH_TOKEN="$GH_TOKEN" python3 - <<'PY'
          import json, subprocess, os
          arts = json.load(open('/tmp/arts.json'))
          if not arts:
              raise SystemExit('error: 未找到本次 tag 构建的产物')
          for a in arts:
              print(f'下载 {a["name"]}')
              subprocess.run(['curl', '-sSL', '-H', f'Authorization: Bearer {os.environ["GH_TOKEN"]}',
                              '-H', 'Accept: application/vnd.github+json',
                              '-o', '/tmp/artifact.zip', a['url']], check=True)
              subprocess.run(['unzip', '-oq', '/tmp/artifact.zip', '-d', 'release-assets'], check=True)
          os.remove('/tmp/artifact.zip')
          print(f'共下载 {len(arts)} 个产物')
          PY
          echo "== 下载结果 =="; find release-assets -type f | sort

      - name: 生成合并 SHA256SUMS
        run: |
          set -euo pipefail
          (cd release-assets && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > release-assets/SHA256SUMS.txt
          echo "== 产物清单 =="; find release-assets -type f | sort
          echo "== SHA256SUMS =="; cat release-assets/SHA256SUMS.txt

      - name: 发布 preflight 总检位（矩阵完备+体积下限+校验和复核，任一失败终止发布）
        run: bash scripts/release-preflight.sh release-assets

      - name: 生成结构化 Release 正文
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            bash scripts/release-notes.sh "$PREV_TAG" "$GITHUB_REF_NAME" > release-body.md
          else
            printf '# Release %s\n\n（首个可生成正文的 tag；此前无历史。）\n' "$GITHUB_REF_NAME" > release-body.md
          fi
          # 多行 body 写入 file 供 action 读取（换行安全）
          { echo "body<<BODY"; cat release-body.md; echo "BODY"; } >> "$GITHUB_OUTPUT"
          echo "== 生成正文 =="; cat release-body.md

      # 预发布/Latest 判定走 step 内 bash 正则（grep -E 完整语义：v1.2.0rc1 无点形态也命中）——
      # 不用表达式 matches()：表达式层被 GitHub 判为 workflow 解析失败时整个文件失效
      # （实测症状：workflow name 回退为路径、push 产出零 job failure run）。
      # make_latest 仅对稳定版置 true——prerelease 抢 Latest 会误导普通用户的「检查更新」。
      - name: 预发布与 Latest 判定
        id: relmeta
        run: |
          if echo "$GITHUB_REF_NAME" | grep -Eq '[._-](rc|beta|alpha)([.0-9]*)?$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          make_latest: ${{ steps.relmeta.outputs.latest }}
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/SHA256SUMS.txt
