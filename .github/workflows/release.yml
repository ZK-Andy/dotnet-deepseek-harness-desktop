name: release

# 统一发布：tag v*（自动）触发，聚合三平台产物 + 生成结构化双语正文 + 合并 SHA256SUMS + 创建单个 Release。
# 单一 owner —— 修复旧方案（linux/macos/windows 各自 publish-release 都开 generate_release_notes
# 并行写正文，导致 body 重复 N 次）的重复与竞争。
# tag 命名保持 v0.1.x；后缀含 rc/beta/alpha（如 v1.2.0-rc.1、v1.2.0rc1）的 tag 标 prerelease。
#
# 三平台包由 `package.yml`（workflow_call）在同一 run 内产出，发布作业以 `needs:` 等它——
# 发布作业的放行门就是这条依赖：包腿（含安装冒烟）任一失败都不启动发布，
# 故没有「轮询 artifact 存在性」与「失败逃逸检查」这一层，产物也不必经 API 跨 run 下载。
#
# 手动 dispatch：分支 ref 只出包不发布（发布作业的 `if` 只认 tag）；tag ref 走完整发布。
# 发布失败后的恢复路径 = 在该 tag 的 run 上「Re-run failed jobs」（产物仍在同一 run 内，7 天留存）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      # 版本由 package-version.sh 从 ref 解析（tag ref 取 tag；分支 ref 回退 csproj <Version>）。
      # 公开发布一律不自签（自签仅内部/开发验证用，对终端用户 Gatekeeper/SmartScreen 无效）。
      version: ''
      self_sign: false

  release:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史 + tags，供 release-notes.sh 生成 compare 与分类
          persist-credentials: false

      - name: 下载三平台产物（同 run，经 download-artifact）
        uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          # 三个 artifact 压平进同一目录：资产名矩阵由 release-preflight.sh 断言，不进子目录
          merge-multiple: true
          path: release-assets

      # 这一串是**准备**不是校验门：同一批字节在本 run 内先算后列，`release-preflight.sh`
      # 的 `sha256sum -c` 复核的也是同一批字节（自指）。错包检测在下一步 preflight 的
      # 资产矩阵 + 体积下限（相对命名模式判定）。
      - name: 生成合并 SHA256SUMS（准备，非校验门）
        run: |
          set -euo pipefail
          (cd release-assets && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > release-assets/SHA256SUMS.txt
          echo "== 产物清单 =="; find release-assets -type f | sort
          echo "== SHA256SUMS =="; cat release-assets/SHA256SUMS.txt

      - name: 发布 preflight 总检位（矩阵完备+体积下限+校验和复核，任一失败终止发布）
        run: bash scripts/release-preflight.sh release-assets

      - name: 生成结构化 Release 正文
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            bash scripts/release-notes.sh "$PREV_TAG" "$GITHUB_REF_NAME" > release-body.md
          else
            printf '# Release %s\n\n（首个可生成正文的 tag；此前无历史。）\n' "$GITHUB_REF_NAME" > release-body.md
          fi
          # 多行 body 写入 file 供 action 读取（换行安全）
          { echo "body<<BODY"; cat release-body.md; echo "BODY"; } >> "$GITHUB_OUTPUT"
          echo "== 生成正文 =="; cat release-body.md

      # 预发布/Latest 判定走 step 内 bash 正则（grep -E 完整语义：v1.2.0rc1 无点形态也命中）——
      # 不用表达式 matches()：表达式层被 GitHub 判为 workflow 解析失败时整个文件失效
      # （实测症状：workflow name 回退为路径、push 产出零 job failure run）。
      # make_latest 仅对稳定版置 true——prerelease 抢 Latest 会误导普通用户的「检查更新」。
      - name: 预发布与 Latest 判定
        id: relmeta
        run: |
          if echo "$GITHUB_REF_NAME" | grep -Eq '[._-](rc|beta|alpha)([.0-9]*)?$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          make_latest: ${{ steps.relmeta.outputs.latest }}
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/SHA256SUMS.txt
