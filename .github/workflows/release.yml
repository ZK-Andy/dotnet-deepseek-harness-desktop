name: release

# 统一发布：tag v*（自动）触发，聚合三平台产物 + 生成结构化双语正文 + 合并 SHA256SUMS + 创建单个 Release。
# 单一 owner —— 修复旧方案（linux/macos/windows 各自 publish-release 都开 generate_release_notes
# 并行写正文，导致 body 重复 N 次）的重复与竞争。
# tag 命名保持 v0.1.x；含 rc/beta/alpha 的 tag 标 prerelease。
#
# 竞态防护：本 workflow 与三个 package workflow 因同一 tag 并行触发，先「等待三平台产物就绪」
# （按 workflow_run.head_sha 关联到本次 tag 构建轮询），避免产物未上传就下载空包。
# 亦支持 workflow_dispatch 手动触发（三平台产物已备时）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史 + tags，供 release-notes.sh 生成 compare 与分类

      - name: 等待三平台产物就绪（本 tag 构建）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          jq_filter="[.artifacts[]|select(.expired==false and (.workflow_run.head_sha==\"$sha\"))|.name]|join(\" \")"
          for i in $(seq 1 150); do
            resp="$(gh api "repos/$repo/actions/artifacts?per_page=100" --jq "$jq_filter" 2>/dev/null || true)"
            ok=1
            for want in linux- macos- windows-; do
              [[ "$resp" == *"${want}"*-packages* ]] || ok=0
            done
            if [[ "$ok" == 1 ]]; then echo "三平台产物就绪: $resp"; exit 0; fi
            echo "等待三平台产物（$((i*10))s / ~25m）：$resp"
            sleep 10
          done
          echo "error: 等待三平台产物超时" >&2; exit 1

      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release-assets
          merge-multiple: true

      - name: 生成合并 SHA256SUMS
        run: |
          set -euo pipefail
          (cd release-assets && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > release-assets/SHA256SUMS.txt
          echo "== 产物清单 =="; find release-assets -type f | sort
          echo "== SHA256SUMS =="; cat release-assets/SHA256SUMS.txt

      - name: 生成结构化 Release 正文
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            bash scripts/release-notes.sh "$PREV_TAG" "$GITHUB_REF_NAME" > release-body.md
          else
            printf '# Release %s\n\n（首个可生成正文的 tag；此前无历史。）\n' "$GITHUB_REF_NAME" > release-body.md
          fi
          # 多行 body 写入 file 供 action 读取（换行安全）
          { echo "body<<BODY"; cat release-body.md; echo "BODY"; } >> "$GITHUB_OUTPUT"
          echo "== 生成正文 =="; cat release-body.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc.') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: true
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.zip
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/SHA256SUMS.txt
