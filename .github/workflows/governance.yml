name: governance

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 真门：模板治理字段与「workflow run: 禁插值事件载荷」由脚本判定，退出码即结论；
      # 脚本同时是本地 pre-commit 的执行体，判据只有一份实现。
      - name: "治理门禁（模板字段 + 工作流 run: 禁止插值事件载荷）"
        run: python3 scripts/verify-governance.py
      - name: "提示：Issue/PR 正文形状（不判门，仅日志留痕）"
        # 事件载荷（标题/正文/labels）一律经 env 传入，**禁止**在 run: 里插值 ${{ github.event.* }}：
        # 正文里的反引号会被 shell 当命令替换执行（脚本注入；模板本身就用反引号），
        # 且注入内容一旦不是命令即 exit 127 把这条提示级校验变成红。见 PR #1 的实跑证据。
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # 提示级：正文是否套模板是分诊时的事，不拦合并（真门是上一步的模板字段校验）。
          echo "== governance 输入提示（提示级，不判门）=="
          echo "event=$EVENT_NAME"
          if [[ "$EVENT_NAME" == "issues" ]]; then
            echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            echo "labels: $ISSUE_LABELS"
            if [[ -z "$ISSUE_BODY" ]]; then
              echo "::warning::Issue 正文为空"
            fi
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "PR #$PR_NUMBER: $PR_TITLE"
            if ! grep -q "Reviewer Checklist" <<<"$PR_BODY"; then
              echo "::warning::PR 描述未包含 Reviewer Checklist（请用 .github/pull_request_template.md）"
            fi
            if ! grep -q "change-scope" <<<"$PR_BODY"; then
              echo "::warning::PR 未贴最小证据（scripts/change-scope.sh）"
            fi
          fi
          echo "governance 输入提示完成（提示级）"
