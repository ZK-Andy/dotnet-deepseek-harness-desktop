name: freshness

# 上游钉版漂移定时巡检（A 线，ADR freshness-pin-patrol）：只做感知不做升级——
# 漂移开/更新固定标题 issue（追平自动关），内部不一致或探测失败让 run 变红。
# bump 拍板权留人：dsh rc 升级需连带行为复验，详见 ADR。

on:
  schedule:
    - cron: '47 2 * * 1' # 每周一 02:47 UTC，错峰整点
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: patrol
        name: 钉版巡检
        run: |
          set +e
          bash scripts/check-pin-freshness.sh --output patrol-report.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat patrol-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patrol-report
          path: patrol-report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: 漂移 → 开/更新 issue
        if: steps.patrol.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[freshness] 上游钉版漂移待拍板'
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file patrol-report.txt
            echo "已追加到既有 issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file patrol-report.txt
          fi

      - name: 追平 → 关闭遗留 issue
        if: steps.patrol.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[freshness] 上游钉版漂移待拍板'
        run: |
          for n in $(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "本轮巡检无漂移，钉版已追平，自动关闭。"
          done

      - name: 内部不一致 / 探测失败 → 红 run 可见化
        if: steps.patrol.outputs.code == '2' || steps.patrol.outputs.code == '3'
        run: |
          echo "巡检异常退出（code=${{ steps.patrol.outputs.code }}）：2=内部副本不一致（半 bump？）3=上游探测失败。见上方报告与 artifact。"
          exit 1
