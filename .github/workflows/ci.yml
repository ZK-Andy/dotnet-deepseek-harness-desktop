name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式声明 token 权限（不依赖仓库默认设置）：contents 读代码与历史（档位门禁要 base..HEAD），
# pull-requests 读是 `changes` 作业的 dorny/paths-filter 在 PR 事件下列变更文件所需。
permissions:
  contents: read
  pull-requests: read

# 同 ref 新推自动取消在跑的旧一轮，省 CI 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动面分类：纯文档改动让 build-test 显式跳过（run 仍 conclusive 成功），
  # 规避「workflow 级 path filter 跳过导致 PR check 永远 pending」的问题。
  # code 面含 scripts/（文档门禁脚本本身变更须全量验证）与本文件（CI 变更自验）；
  # 结构级构建输入一并纳入——.editorconfig/Directory.*.props/global.json 都能翻转
  # build 或 format 结论，漏判即整条 format 门禁一起跳过。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - '*.slnx'
              - '.editorconfig'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/ci.yml'

  # 文档/ADR/插件改动面（含 plugins/ 下 JS 插件、docs/、手写文档）无需 dotnet，
  # 但必须跑文档门禁（verify-*）。独立 job 无条件触发——修复「改动在 plugins/
  # 或 docs/ 下不命中 code filter、连 verify-* 都不跑」的门禁盲区。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # 评审档位硬闸需 base..HEAD 历史（--since 比较已提交变更）
      - name: 文档门禁
        run: |
          python3 scripts/verify-adr-format.py
          python3 scripts/verify-cookbook.py
          python3 scripts/verify-doc-budgets.py --manifest scripts/doc-budgets.manifest.json
          python3 scripts/verify-md-links.py
          python3 scripts/verify-readme-badges.py
          python3 scripts/verify-handoff-structure.py
          python3 scripts/verify-governance.py
          python3 scripts/verify-skill-format.py
      - name: UI 文案单一词典（批次 A）
        run: |
          python3 scripts/verify-ui-copy.py --self-test
          python3 scripts/verify-ui-copy.py
      # 打包版本解析与 tag 一致性判据（唯一家）：三条打包腿只在真 tag 上才会走到
      # 「输入与 tag 不一致」那条分支，故此处的自测是它唯一的机械执行点。
      - name: 打包版本解析自测（tag/输入一致性判据）
        run: bash scripts/package-version.sh --self-test
      - name: 架构尺寸健康闸（R4/R1 先拆再上硬门槛）
        run: |
          python3 scripts/verify-code-health.py --enforce
      - name: 契约扫描（R3 边界/日志）
        run: |
          python3 scripts/verify-code-conventions.py --enforce
      - name: 评审档位硬闸（FULL 档变更须携 Review 证据；ADR review-tier-escape-proofing）
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="$REVIEW_BASE"
          # 无 base（首推/新建分支）时无法判定变更集，本步必须停——工作树扫描在干净的
          # CI checkout 上是空集、恒绿，不得作为 fallback。判据与 verify-review-tier
          # 对不可达 base 的处置同源（无法判定 = 违规）。
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::档位门禁无法判定变更集（无 base，首推/新建分支）——不得静默放行" >&2
            exit 1
          fi
          echo "review-tier --since $BASE"
          python3 scripts/verify-review-tier.py --since "$BASE" --enforce

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 三平台测试腿：FileShare.None 跨进程锁语义等 OS 级行为只有跑在真内核上才算数
        # （Windows 是多实例可达面；ubuntu 腿额外承担 format 门禁与覆盖率基线）
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: dotnet build dotnet-deepseek-harness-desktop.slnx -c Debug
      # 编码规范门禁（ADR csharp-coding-standard）：按仓库根 .editorconfig 强制格式/风格。
      # --verify-no-changes：有差异即 exit 非 0，fail loud；新代码必须符合规范才能过门禁。
      - name: format (coding standards gate)
        if: runner.os == 'Linux'
        run: dotnet format dotnet-deepseek-harness-desktop.slnx --verify-no-changes --severity warn
      - name: test with coverage
        id: test
        if: runner.os == 'Linux'
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: test (os-level semantics leg)
        if: runner.os != 'Linux'
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build --filter "FullyQualifiedName~StalePackagePrunerTests|FullyQualifiedName~ReleaseAssetTests"
      - name: coverage summary（并集复算；测试绿时比对基线，低于基线超容差即 fail）
        if: always() && runner.os == 'Linux'
        env:
          TESTS_OUTCOME: ${{ steps.test.outcome }}
        run: |
          echo "== coverage files =="
          find TestResults -name "*.xml" -type f | head -20
          # 每个测试工程一个 cobertura；基线是并集（见 scripts/coverage-summary.py 与
          # ADR testing/2026-09-14-coverage-baseline-multi-project-merge）。
          # 比对只在测试步成功时进行：测试红了只会留下半量 TestResults，拿它比基线
          # 是把「测试失败」误诊成「覆盖率下滑」；此时只复算留数。
          if [[ "$TESTS_OUTCOME" == "success" ]]; then
            python3 scripts/coverage-summary.py --results TestResults \
              --baseline scripts/test-baseline.json --tolerance-pp 0.5
          else
            # 只复算不判门；若连 cobertura 都没留下，仍按缺产物判红（fail loud 的既有语义）。
            echo "note: 测试步未成功（${TESTS_OUTCOME}），本次覆盖率数不可比，只复算不判门"
            python3 scripts/coverage-summary.py --results TestResults
          fi
      - name: upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
