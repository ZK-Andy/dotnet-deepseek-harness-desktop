name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式声明 token 权限（不依赖仓库默认设置）：contents 读代码与历史（档位门禁要 base..HEAD），
# pull-requests 读是 `changes` 作业的 dorny/paths-filter 在 PR 事件下列变更文件所需。
permissions:
  contents: read
  pull-requests: read

# 同 ref 新推自动取消在跑的旧一轮，省 CI 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动面分类：纯文档改动让 build-test 显式跳过（run 仍 conclusive 成功），
  # 规避「workflow 级 path filter 跳过导致 PR check 永远 pending」的问题。
  # code 面含 scripts/（文档门禁脚本本身变更须全量验证）与本文件（CI 变更自验）；
  # 结构级构建输入一并纳入——.editorconfig/Directory.*.props/global.json 都能翻转
  # build 或 format 结论，漏判即整条 format 门禁一起跳过。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'tools/**'
              # 只列参与构建/打包的图标资产（csproj 的 Content 输入与安装器图标）；
              # 其余 assets/（README 图、hicolor 图标档）是文档面/打包腿输入，不进 build-test
              # 判据面——列进来只会让改截图也跑满三平台矩阵，却不增加任何检出。
              - 'assets/icon.png'
              - 'assets/icon.ico'
              - '*.slnx'
              - '.editorconfig'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/ci.yml'

  # 文档/ADR/插件改动面（含 plugins/ 下 JS 插件、docs/、手写文档）无需 dotnet，
  # 但必须跑文档门禁（verify-*）。独立 job 无条件触发——修复「改动在 plugins/
  # 或 docs/ 下不命中 code filter、连 verify-* 都不跑」的门禁盲区。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0   # 评审档位硬闸需 base..HEAD 历史（--since 比较已提交变更）
      - name: 文档门禁
        run: |
          python3 scripts/verify-adr-format.py
          python3 scripts/verify-cookbook.py
          python3 scripts/verify-doc-budgets.py --manifest scripts/doc-budgets.manifest.json
          python3 scripts/verify-md-links.py
          python3 scripts/verify-readme-badges.py
          python3 scripts/verify-handoff-structure.py
          python3 scripts/verify-governance.py
          python3 scripts/verify-skill-format.py
      # 脚本层静态检查工具：钉版 + sha256 校验（版本必须与本地同版，否则诊断集合漂移会
      # 让「本地绿 CI 红」，见 docs/script-standards.md「工具版本」）。
      - name: 装脚本层静态检查工具（shellcheck + actionlint）
        run: |
          bash scripts/install-linters.sh "$RUNNER_TEMP/linters"
          echo "$RUNNER_TEMP/linters" >> "$GITHUB_PATH"
      - name: 脚本规范门禁（S1-S6：errexit / 尺寸 / 库形态 / 旋钮声明 / 库单源 / shellcheck）
        run: bash scripts/verify-shell-standards.sh
      - name: "actionlint（工作流静态检查，对 run: 块跑 shellcheck -S warning）"
        run: actionlint -shellcheck="shellcheck -S warning"
      # 离线夹具全量接线：冒烟共用面（落定/裁决/看门狗/见证/等待循环）与三平台专属、
      # 包布局三平台分支、三包脚本共用头部与 Inno 模板渲染——这些逻辑多数只在 tag/dispatch
      # 的打包腿上跑，自测让它们每次 push 都被执行。
      - name: 脚本自测（离线夹具，不碰网络与安装器）
        run: |
          bash scripts/verify-shell-standards.sh --self-test
          bash scripts/verify-package-layout.sh --self-test
          bash scripts/package-linux.sh --self-test
          bash scripts/package-macos.sh --self-test
          bash scripts/package-windows.sh --self-test
          bash scripts/dev-sign.sh --self-test
          bash scripts/smoke-linux-rpm.sh --self-test
          bash scripts/prepare-windows-smoke.sh --self-test
          bash scripts/smoke-install-linux.sh --self-test
          bash scripts/smoke-install-macos.sh --self-test
          bash scripts/smoke-install-windows.sh --self-test
          bash scripts/smoke-linux-rpm-inner.sh --self-test
          bash scripts/release-preflight.sh --self-test
          bash scripts/release-notes.sh --self-test
      # Python 门禁自测（F 批）：gate_common 共享模块（slug/C# 字面量扫描器/自测
      # idiom 的离线夹具）+ 两道最薄门（md-links/doc-budgets）的补自测——两门
      # pre-commit 与 CI 都跑，此前判据回归无离线夹具兜底
      #（ADR process/2026-09-29-gate-common-shared-module）。
      - name: Python 门禁自测（gate_common + md-links + doc-budgets）
        run: |
          python3 scripts/gate_common.py --self-test
          python3 scripts/verify-md-links.py --self-test
          python3 scripts/verify-doc-budgets.py --self-test
          python3 scripts/verify-increment-discipline.py --self-test
          python3 scripts/coverage-summary.py --self-test
      - name: UI 文案单一词典（批次 A）
        run: |
          python3 scripts/verify-ui-copy.py --self-test
          python3 scripts/verify-ui-copy.py
      # 命令 ID 单一事实源（IPC 强类型）：壳侧不得复写已知命令 ID、插件侧不得自造命令
      - name: 命令 ID 单一事实源闸
        run: |
          python3 scripts/verify-host-command-ids.py --self-test
          python3 scripts/verify-host-command-ids.py --enforce
      # Core 纯度闸：Core 源文件不得直接做文件/环境 IO（IO 经端口、适配器落 Infrastructure）
      - name: Core 纯度闸
        run: |
          python3 scripts/verify-core-purity.py --self-test
          python3 scripts/verify-core-purity.py --enforce
      # 打包版本解析与 tag 一致性判据（唯一家）：三条打包腿只在真 tag 上才会走到
      # 「输入与 tag 不一致」那条分支，故此处的自测是它唯一的机械执行点。
      - name: 打包版本解析自测（tag/输入一致性判据）
        run: bash scripts/package-version.sh --self-test
      - name: 架构尺寸健康闸（R4/R1 先拆再上硬门槛）
        run: |
          python3 scripts/verify-code-health.py --enforce
      - name: 契约扫描（R3 边界/日志）
        run: |
          python3 scripts/verify-code-conventions.py --enforce
      - name: 装配面语义闸（R1：根集只装配——方法清单封闭 + new 自有类型 ≤16 + 单 dot 分部 + 禁同步编排；ADR compose-root-form-separation）
        run: |
          python3 scripts/verify-compose-root.py --enforce
      - name: 注册点纪律闸（R1：基础设施具体类型只许出现在注册处；ADR coupling-shift-left-gates）
        run: |
          python3 scripts/verify-registration-discipline.py --enforce
      - name: 解析评审 base（改写历史后的游离 base 显式补拉）
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE="${REVIEW_BASE:-}"
          STATE=none
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              STATE=ok
            else
              # force-with-lease 改写历史后，event.before 指向的提交不再被任何 ref 覆盖：
              # fetch-depth: 0 的 checkout 只取 refs 可达面，本地就没有这个对象。GitHub 允许
              # 按 sha 取游离对象（2026-10-26 探针实证，公开仓匿名可取）；--depth=1 只裁祖先
              # 关系，该提交自身的树与 blob 完整——两闸要的正是这个快照（diff 的 blob 比对与
              # git show 读基线正文），祖先关系无人使用。
              echo "评审 base $BASE 不在本地历史（改写历史后的游离对象），按 sha 补拉" >&2
              timeout 90 git fetch --no-tags --depth=1 origin "$BASE" >&2 || true
              if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
                STATE=ok
              else
                STATE=unreachable
              fi
            fi
          fi
          if [ "$STATE" = "unreachable" ]; then
            # 不可判即违规（ADR review-tier-escape-proofing / increment-gate-enforce）：两条闸都无从
            # 判定变更集，在此统一硬红——后续两闸不再各报一遍，出红步名即原因所在。
            echo "::error::评审 base $BASE 不在历史且补拉失败（force-with-lease 改写历史后的典型形态）——两闸无法判定变更集；先 push 一个空提交重建可判 base" >&2
            exit 1
          fi
          echo "DSH_REVIEW_BASE=$BASE" >> "$GITHUB_ENV"
          echo "DSH_REVIEW_BASE_STATE=$STATE" >> "$GITHUB_ENV"
          echo "review base: state=$STATE base=${BASE:-<none>}"
      - name: 增量纪律闸（耦合左移②：gross/既有文件净增/新文件/跨层扇出/新包引用五帽，超帽即红；ADR increment-gate-enforce、increment-new-file-cap）
        run: |
          # state 只可能 ok/none：unreachable 已在「解析评审 base」步硬红并中止作业。
          if [ "$DSH_REVIEW_BASE_STATE" = "none" ]; then
            echo "::warning::增量闸无 base 可比（首推/新建分支），本次跳过" >&2
          else
            echo "increment-discipline --since $DSH_REVIEW_BASE"
            python3 scripts/verify-increment-discipline.py --since "$DSH_REVIEW_BASE" --enforce --exempt .agents/notes/implemented/bug-fix/2026-10-25-window-identity-geometry-teardown.md
          fi
      - name: 评审档位硬闸（FULL 档变更须携 Review 证据；ADR review-tier-escape-proofing）
        run: |
          # 无 base（首推/新建分支）无法判定变更集，本步必须停——工作树扫描在干净的 CI checkout 上是
          # 空集、恒绿，不得作为 fallback。base 不可达已在「解析评审 base」步硬红，此处 state 只可能 ok/none。
          if [ "$DSH_REVIEW_BASE_STATE" = "none" ]; then
            echo "::error::档位门禁无法判定变更集（无 base，首推/新建分支）——不得静默放行" >&2
            exit 1
          fi
          echo "review-tier --since $DSH_REVIEW_BASE"
          python3 scripts/verify-review-tier.py --since "$DSH_REVIEW_BASE" --enforce

  # companion 客户端半边的 JS 测试腿（ADR testing/2026-10-21-companion-client-js-tests）：
  # 插件改动不命中 code 过滤面，故无条件执行；node:test 零依赖，不需要 pnpm install。
  # 命令用 Node 的默认测试发现（无位置参数）——目录位置参数的行为随 Node 版本变化，
  # 实测矩阵与取舍见 ADR bug-fix/2026-10-21-companion-js-ci-node22。
  companion-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: companion client JS tests
        working-directory: plugins/dsh-desktop-companion
        run: node --test

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 三平台测试腿：全量套件在三个真内核上都跑（FileShare.None 跨进程锁语义等 OS 级
        # 行为只有跑在真内核上才算数；Windows 是多实例可达面）。ubuntu 腿额外承担 format
        # 门禁与覆盖率基线；另两腿不设过滤，四个测试工程在真内核上一并执行。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: dotnet build dotnet-deepseek-harness-desktop.slnx -c Debug
      # 编码规范门禁（ADR csharp-coding-standard）：按仓库根 .editorconfig 强制格式/风格。
      # --verify-no-changes：有差异即 exit 非 0，fail loud；新代码必须符合规范才能过门禁。
      - name: format (coding standards gate)
        if: runner.os == 'Linux'
        run: dotnet format dotnet-deepseek-harness-desktop.slnx --verify-no-changes --severity warn
      - name: test with coverage
        id: test
        if: runner.os == 'Linux'
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: test (full suite on OS-level semantics legs)
        if: runner.os != 'Linux'
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build
      - name: coverage summary（并集复算；测试绿时比对基线，低于基线超容差即 fail）
        if: always() && runner.os == 'Linux'
        env:
          TESTS_OUTCOME: ${{ steps.test.outcome }}
        run: |
          echo "== coverage files =="
          find TestResults -name "*.xml" -type f | head -20
          # 每个测试工程一个 cobertura；基线是并集（见 scripts/coverage-summary.py 与
          # ADR testing/2026-09-14-coverage-baseline-multi-project-merge）。
          # 比对只在测试步成功时进行：测试红了只会留下半量 TestResults，拿它比基线
          # 是把「测试失败」误诊成「覆盖率下滑」；此时只复算留数。
          if [[ "$TESTS_OUTCOME" == "success" ]]; then
            python3 scripts/coverage-summary.py --results TestResults \
              --baseline scripts/test-baseline.json --tolerance-pp 0.5
          else
            # 只复算不判门；若连 cobertura 都没留下，仍按缺产物判红（fail loud 的既有语义）。
            echo "note: 测试步未成功（${TESTS_OUTCOME}），本次覆盖率数不可比，只复算不判门"
            python3 scripts/coverage-summary.py --results TestResults
          fi
      - name: upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
