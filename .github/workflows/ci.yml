name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 文档门禁
        run: |
          python3 scripts/verify-adr-format.py
          python3 scripts/verify-doc-budgets.py --manifest scripts/doc-budgets.manifest.json
          python3 scripts/verify-md-links.py
      - name: build
        run: dotnet build dotnet-deepseek-harness-desktop.slnx -c Debug
      - name: test with coverage
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: coverage summary
        if: always()
        run: |
          echo "== coverage files =="
          find TestResults -name "*.xml" -type f | head -20
          if ls TestResults/**/coverage.cobertura.xml 1>/dev/null 2>&1; then
            echo "== cobertura 摘要 =="
            grep -E "line-rate|branch-rate" TestResults/**/coverage.cobertura.xml | head -20
          fi
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
