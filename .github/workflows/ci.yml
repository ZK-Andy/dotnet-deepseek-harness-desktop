name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 ref 新推自动取消在跑的旧一轮，省 CI 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动面分类：纯文档改动让 build-test 显式跳过（run 仍 conclusive 成功），
  # 规避「workflow 级 path filter 跳过导致 PR check 永远 pending」的问题。
  # code 面含 scripts/（文档门禁脚本本身变更须全量验证）与本文件（CI 变更自验）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - '*.slnx'
              - '.github/workflows/ci.yml'

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 文档门禁
        run: |
          python3 scripts/verify-adr-format.py
          python3 scripts/verify-doc-budgets.py --manifest scripts/doc-budgets.manifest.json
          python3 scripts/verify-md-links.py
      - name: build
        run: dotnet build dotnet-deepseek-harness-desktop.slnx -c Debug
      - name: test with coverage
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: coverage summary
        if: always()
        run: |
          echo "== coverage files =="
          find TestResults -name "*.xml" -type f | head -20
          if ls TestResults/**/coverage.cobertura.xml 1>/dev/null 2>&1; then
            echo "== cobertura 摘要 =="
            grep -E "line-rate|branch-rate" TestResults/**/coverage.cobertura.xml | head -20
          fi
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
