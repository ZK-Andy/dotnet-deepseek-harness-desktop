name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 文档门禁
        run: |
          python3 scripts/verify-adr-format.py
          python3 scripts/verify-doc-budgets.py --manifest scripts/doc-budgets.manifest.json
          python3 scripts/verify-md-links.py
      - name: build
        run: dotnet build dotnet-deepseek-harness-desktop.slnx -c Debug
      - name: test
        run: dotnet test dotnet-deepseek-harness-desktop.slnx -c Debug --no-build
