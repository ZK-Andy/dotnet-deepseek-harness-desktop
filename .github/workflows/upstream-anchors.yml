name: upstream-anchors

# 注入面依赖的上游锚点（DOM 类名后缀 / `--dsw-*` 设计变量）住在 dsh 的客户端资产里，
# 上游改名不抛错——页面只是静默少一条视觉规则，只有用户机上才看得见（判据与通道规则见
# ADR process/2026-10-13-upstream-anchor-probe）。独立成一条工作流而不是塞进 ci.yml：
# 它探的是上游包（需要一次全局 npm 安装），且只在 dsh 发版时才会变——压在每次 push 上是纯成本。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/upstream-anchors.json'
      - 'scripts/verify-upstream-anchors.py'
      - '.github/workflows/upstream-anchors.yml'

permissions:
  contents: read

concurrency:
  group: upstream-anchors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 离线夹具自测
        run: python3 scripts/verify-upstream-anchors.py --self-test
      # 正式版通道 = @next（@alpha 为预览版）：探的必须是产品首装那份，见 ADR。
      - name: 装正式版 dsh（@next）
        run: npm install -g @deepseek-ai/dsh@next
      - name: 锚点探测（required 锚缺失即红；显式钉住刚装的那份，路径指错即 FAIL）
        run: python3 scripts/verify-upstream-anchors.py --dsh-root "$(npm root -g)/@deepseek-ai/dsh" --enforce
