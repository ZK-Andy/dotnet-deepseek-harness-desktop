name: package-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag 触发取 tag；填 v0.1.3 亦可）'
        required: false
        default: ''
      self_sign:
        description: '自签 Authenticode（仅内部/开发验证；对终端用户 SmartScreen 无效）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: x64
      SELF_SIGN: ${{ github.event.inputs.self_sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 解析钉版正典（bundle-runtime-ci.sh 单一来源，ADR pin-source-convergence）
        id: pins
        shell: bash
        run: |
          echo "dsh=$(bash scripts/check-pin-freshness.sh --print dsh)" >> "$GITHUB_OUTPUT"
          echo "node=$(bash scripts/check-pin-freshness.sh --print node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.dsh-pnpm/store
          key: pnpm-store-win-x64-v2
          restore-keys: pnpm-store-win-x64-
      - name: 缓存 resources/runtime 闭包
        uses: actions/cache@v4
        with:
          path: resources/runtime
          key: dsh-closure-win-x64-${{ steps.pins.outputs.dsh }}-${{ steps.pins.outputs.node }}-v1-plug-${{ hashFiles('plugins/**', 'scripts/bundle-runtime-ci.sh') }}
          restore-keys: dsh-closure-win-x64-
      - name: 生成捆绑运行时
        shell: bash
        run: bash scripts/bundle-runtime-ci.sh win-x64
      - name: 确定版本
        shell: bash
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          # 输入留空时回退 csproj <Version>（版本单一来源；空值会令 -p:Version= 触发 MSB4044，前置 fail loud）
          if [[ -z "$V" ]]; then
            V="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/DeepSeek.Harness.Desktop/DeepSeek.Harness.Desktop.csproj | head -1)"
          fi
          if [[ -z "$V" ]]; then
            echo "::error::无法确定打包版本：tag 无版本、输入为空且 csproj 无 <Version>"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "打包版本: $V (ref=${{ github.ref }} event=${{ github.event_name }})"
      - name: dotnet publish
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o artifacts/publish-win-x64
      - name: 打 Windows 包（安装器 exe，文件名含 windows 标识；不再产独立 zip）
        shell: bash
        run: bash scripts/package-windows.sh artifacts/publish-win-x64
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            artifacts/win-x64/*.exe
          if-no-files-found: error
          retention-days: 7
