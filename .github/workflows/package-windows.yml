name: package-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本'
        required: false
        default: '0.1.0'
      self_sign:
        description: '自签 Authenticode（仅内部/开发验证；对终端用户 SmartScreen 无效）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: x64
      SELF_SIGN: ${{ github.event.inputs.self_sign }}
      DSH_VERSION: '0.1.1-rc.1'
      NODE_VERSION: '22.23.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.dsh-pnpm/store
          key: pnpm-store-win-x64-v2
          restore-keys: pnpm-store-win-x64-
      - name: 缓存 resources/runtime 闭包
        uses: actions/cache@v4
        with:
          path: resources/runtime
          key: dsh-closure-win-x64-${{ env.DSH_VERSION }}-${{ env.NODE_VERSION }}-v1
          restore-keys: dsh-closure-win-x64-
      - name: 生成捆绑运行时
        shell: bash
        run: bash scripts/bundle-runtime-ci.sh win-x64
      - name: 确定版本
        shell: bash
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: dotnet publish
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r win-x64 -p:PublishAot=false --self-contained true -o artifacts/publish-win-x64
      - name: 打 Windows 包（安装器 exe，文件名含 windows 标识；不再产独立 zip）
        shell: bash
        run: bash scripts/package-windows.sh artifacts/publish-win-x64
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            artifacts/win-x64/*.exe
          if-no-files-found: error
          retention-days: 7
