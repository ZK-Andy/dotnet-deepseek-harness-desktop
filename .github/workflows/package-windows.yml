name: package-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag 触发取 tag；填 v0.1.3 亦可）'
        required: false
        default: ''
      self_sign:
        description: '自签 Authenticode（仅内部/开发验证；对终端用户 SmartScreen 无效）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: x64
      SELF_SIGN: ${{ github.event.inputs.self_sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 确定版本
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"; V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          # 输入留空时回退 csproj <Version>（版本单一来源；空值会令 -p:Version= 触发 MSB4044，前置 fail loud）
          if [[ -z "$V" ]]; then
            V="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/DeepSeek.Harness.Desktop/DeepSeek.Harness.Desktop.csproj | head -1)"
          fi
          if [[ -z "$V" ]]; then
            echo "::error::无法确定打包版本：tag 无版本、输入为空且 csproj 无 <Version>"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "打包版本: $V (ref=${{ github.ref }} event=${{ github.event_name }})"
      - name: dotnet publish
        shell: bash
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r win-x64 --self-contained true -p:Version="$VERSION" -o artifacts/publish-win-x64
      - name: 载荷冒烟探针（publish 产物 native 面：FFI 加载/导出、图像解码、ConPTY）
        shell: bash
        timeout-minutes: 5
        run: |
          dotnet publish tests/DeepSeek.Harness.Desktop.PayloadSmoke -c Release -r win-x64 --self-contained true -o artifacts/payload-smoke
          artifacts/payload-smoke/DeepSeek.Harness.Desktop.PayloadSmoke.exe artifacts/publish-win-x64
      - name: 打 Windows 包（安装器 exe，文件名含 windows 标识；不再产独立 zip）
        shell: bash
        run: bash scripts/package-windows.sh artifacts/publish-win-x64
      - name: 安装 WebView2 Evergreen（运行态实验，ADR smoke-runner-deepening）
        shell: bash
        env:
          # Git Bash 会把 /silent /install 当 POSIX 路径转换（cookbook [脚本]；
          # smoke-install-windows.sh /VERYSILENT 同款先例），此处排除。
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/MicrosoftEdgeWebview2Setup.exe"
          for i in 1 2 3; do
            curl -sSL --fail --retry 2 -o "$EXE" "https://go.microsoft.com/fwlink/p/?LinkId=2124703" && break || sleep 10
          done
          [[ -f "$EXE" ]] || { echo "::error::Evergreen 下载失败（3 次重试）"; exit 1; }
          "$EXE" /silent /install
          echo "== WebView2 版本留痕（证据位；fail loud 由安装器退出码承担） =="
          powershell -NoProfile -Command "Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' | Select-Object Name | Format-Table -HideTableHeaders | Out-String -Width 200"
      - name: 安装冒烟（静默安装→启动→等 dsh web URL 行或引导启动行）
        shell: bash
        env:
          SMOKE_SHOT_DIR: ${{ github.workspace }}/smoke-shots
        run: bash scripts/smoke-install-windows.sh "$(ls artifacts/win-x64/*-setup.exe | head -1)"
      - name: 上传冒烟截图（best-effort，人眼复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shot-windows-x64
          path: ${{ github.workspace }}/smoke-shots/
          if-no-files-found: warn
          retention-days: 7
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            artifacts/win-x64/*.exe
          if-no-files-found: error
          retention-days: 7
