name: package-linux

# 参照 pilot-harness .github/workflows/desktop.yml：
#  - 预览（手动 workflow_dispatch 无 tag）产 7 天 Artifacts；正式（v* tag）产 Release + SHA256SUMS
#  - 本地不产包，所有产物来自 GitHub-hosted ubuntu runner（含 dpkg-deb/rpmbuild）
#  - 节省并发：同 ref（tag/分支）的新跑自动取消旧跑（group 按 ref，非 sha）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag 触发取 tag；填 v0.1.3 亦可）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # arm64 于 2026-08-25 恢复：Ryn.Interop 0.30.4 起供给 runtimes/linux-arm64/native
    # （2026-08-24 曾因缺原生库停发，恢复依据见 ADR artifact-verification-chain）。
    # fail-fast=false：两腿是独立平台，一腿失败不连坐另一腿（首跑 arm64 rpm 冒烟
    # 抓到 EOL F41 缺 webkitgtk6.0 时，x64 的对照证据被取消掩埋——教训）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runs-on: ubuntu-latest
            # 落定窗秒数（ADR settle-per-arch-window + page-verdict-gate）：窗口须覆盖含自愈
            # 重进的最坏链——建窗残量 120 + 两跳(30+5)×2 + 探针 15×2 + 重进(35) + 再探针 30 ≈ 285s；
            # 裁决行出现前收工即假红。
            settle_seconds: 300
            # 冻结腿（ADR smoke-witness-real-and-eval-first-hop）：0=正常门。
            frozen: 0
          - arch: arm64
            rid: linux-arm64
            runs-on: ubuntu-24.04-arm
            settle_seconds: 300
            # arm64 原生 hang 已知病灶冻结：①已达仅未落定 → frozen verdict 放行（截图留痕，
            # 不拦发版）；①未见仍红。解冻待 Ryn 最小复现有回音。
            frozen: 1
    runs-on: ${{ matrix.runs-on }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 rpmbuild 与冒烟显示栈（xvfb + 截图 + 会话总线）
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb scrot dbus imagemagick

      - name: 校验 tag 与输入版本一致（如为 Release）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          input="$INPUT_VERSION"
          # tag 触发时输入留空或与 tag 一致均视为合法；不一致则以 tag 为准
          if [[ -n "$input" && "$input" != "$tag" && "$input" != "v$tag" ]]; then
            echo "::warning::inputs.version($input) 与 tag v$tag 不一致，将以 tag 为准"
          fi
          echo "Release tag 版本: $tag"

      - name: 确定打包版本
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="$INPUT_VERSION"
          # 允许输入填 v0.1.3 形式
          V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          # 输入留空时回退 csproj <Version>（版本单一来源：预览包与正式版同源，避免误内嵌旧版本号）
          if [[ -z "$V" ]]; then
            V="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/DeepSeek.Harness.Desktop/DeepSeek.Harness.Desktop.csproj | head -1)"
          fi
          # 空版本会令 dotnet publish 的 -p:Version= 触发 MSB4044 硬失败；此处前置 fail loud 给出可读诊断
          if [[ -z "$V" ]]; then
            echo "::error::无法确定打包版本：tag 无版本、输入为空且 csproj 无 <Version>"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "打包版本: $V (ref=${{ github.ref }} event=${{ github.event_name }}) arch=${{ matrix.arch }} rid=${{ matrix.rid }}"

      - name: dotnet publish（自包含 JIT，对齐 pilot-harness 打包前 build）
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:Version="$VERSION" -o artifacts/publish-${{ matrix.rid }}

      - name: 打 Linux 安装包（deb + rpm，参照 pilot-harness electron-builder 的 linux 产物）
        run: bash scripts/package-linux.sh artifacts/publish-${{ matrix.rid }}

      - name: 校验产物（deb control / rpm Requires，参照 pilot 的 bundle verification）
        shell: bash
        run: |
          set -euo pipefail
          echo "== deb control =="; dpkg-deb -I "artifacts/${{ matrix.rid }}/"*.deb 2>&1 | head -40 || true
          echo "== rpm Requires（应仅含 libwebkitgtk-6.0.so.4，无 aarch64/musl/perl）=="; rpm -qp --requires artifacts/${{ matrix.rid }}/*.rpm 2>&1 | head -60 || true
          echo "== 产物清单 =="; ls -lh artifacts/${{ matrix.rid }}/*.deb artifacts/${{ matrix.rid }}/*.rpm 2>&1 | head -40 || true

      - name: 安装冒烟（装包→首启引导→等 dsh web URL 行，Xvfb 虚拟显示下跑全链）
        shell: bash
        env:
          SMOKE_SHOT_DIR: ${{ github.workspace }}/smoke-shots
          # CI 逃生舱（ADR webkit-sandbox-userns-fallback）：runner 无特权 userns，bwrap 沙箱必 core；
          # 产品侧条件降级在 runner 上同样命中（sysctl 阳性，日志有禁用行），CI 显式设与产品行为一致。
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          # 软件渲染实验（Xvfb 无 DRI3 加速，DRI3 warning 后窗口在 dsh 就位前消失；纯 CI 取证，不动产品）：
          # 关 WebKit 合成 + 强制 Mesa 软渲染，看窗口能否存活到第二跳。
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          # 落定窗分腿（ADR settle-per-arch-window）：脚本既有 SMOKE_SETTLE_SECONDS 口，无脚本改动。
          SMOKE_SETTLE_SECONDS: ${{ matrix.settle_seconds }}
          # 冻结腿开关（ADR smoke-witness-real-and-eval-first-hop）：arm64=1，amd64=0。
          SMOKE_FROZEN: ${{ matrix.frozen }}
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" bash scripts/smoke-install-linux.sh artifacts/${{ matrix.rid }}

      - name: 上传冒烟截图（best-effort，Xvfb 下真实开火，无显示回退时空过，人眼复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shot-linux-${{ matrix.arch }}
          path: ${{ github.workspace }}/smoke-shots/
          if-no-files-found: warn
          retention-days: 7

      - name: 上传预览/发布产物（7 天，与 pilot-harness pilot-harness-* 一致）
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          # 只传顶层包：package-linux.sh 已把 rpm mv 到顶层，嵌套 rpmbuild 目录不留副本
          # （否则顶层 + 嵌套同名 rpm 双份进 Release）
          path: |
            artifacts/${{ matrix.rid }}/*.deb
            artifacts/${{ matrix.rid }}/*.rpm
          if-no-files-found: error
          retention-days: 7
