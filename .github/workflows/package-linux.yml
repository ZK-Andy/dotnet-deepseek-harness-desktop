name: package-linux

# 参照 pilot-harness .github/workflows/desktop.yml：
#  - 预览（手动 workflow_dispatch 无 tag）产 7 天 Artifacts；正式（v* tag）产 Release + SHA256SUMS
#  - 本地不产包，所有产物来自 GitHub-hosted ubuntu runner（含 dpkg-deb/rpmbuild）
#  - 节省并发：同一 sha 的重复触发共用组并取消前一次

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag 触发取 tag；填 v0.1.3 亦可）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: package-linux-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runs-on: ubuntu-latest
          - arch: arm64
            rid: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: ${{ matrix.arch }}
      DSH_VERSION: '0.1.1-rc.2'
      NODE_VERSION: '22.23.1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.dsh-pnpm/store
          key: pnpm-store-${{ matrix.rid }}-v2
          restore-keys: pnpm-store-${{ matrix.rid }}-

      - name: 校验 tag 与输入版本一致（如为 Release）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          input="${{ inputs.version }}"
          # tag 触发时输入留空或与 tag 一致均视为合法；不一致则以 tag 为准
          if [[ -n "$input" && "$input" != "$tag" && "$input" != "v$tag" ]]; then
            echo "::warning::inputs.version($input) 与 tag v$tag 不一致，将以 tag 为准"
          fi
          echo "Release tag 版本: $tag"

      - name: 缓存 resources/runtime 闭包
        uses: actions/cache@v4
        with:
          path: resources/runtime
          key: dsh-closure-${{ matrix.rid }}-${{ env.DSH_VERSION }}-${{ env.NODE_VERSION }}-v1-plug-${{ hashFiles('plugins/**', 'scripts/bundle-runtime-ci.sh') }}
          restore-keys: dsh-closure-${{ matrix.rid }}-

      - name: 生成捆绑运行时（下载 Node + pnpm 安装 dsh 闭包，pilot-harness 整树方案）
        run: bash scripts/bundle-runtime-ci.sh ${{ matrix.rid }}

      - name: 确定打包版本
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          # 允许输入填 v0.1.3 形式
          V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          # 输入留空时回退 csproj <Version>（版本单一来源：预览包与正式版同源，避免误内嵌旧版本号）
          if [[ -z "$V" ]]; then
            V="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/DeepSeek.Harness.Desktop/DeepSeek.Harness.Desktop.csproj | head -1)"
          fi
          # 空版本会令 dotnet publish 的 -p:Version= 触发 MSB4044 硬失败；此处前置 fail loud 给出可读诊断
          if [[ -z "$V" ]]; then
            echo "::error::无法确定打包版本：tag 无版本、输入为空且 csproj 无 <Version>"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "打包版本: $V (ref=${{ github.ref }} event=${{ github.event_name }}) arch=${{ matrix.arch }} rid=${{ matrix.rid }}"

      - name: dotnet publish（自包含，关 AOT，对齐 pilot-harness 打包前 build）
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} -p:PublishAot=false --self-contained true -p:Version=${{ env.VERSION }} -o artifacts/publish-${{ matrix.rid }}

      - name: 打 Linux 安装包（deb + rpm，参照 pilot-harness electron-builder 的 linux 产物）
        run: bash scripts/package-linux.sh artifacts/publish-${{ matrix.rid }}

      - name: 校验产物（deb control / rpm Requires，参照 pilot 的 bundle verification）
        shell: bash
        run: |
          set -euo pipefail
          echo "== deb control =="; dpkg-deb -I "artifacts/${{ matrix.rid }}/"*.deb 2>&1 | head -40 || true
          echo "== rpm Requires（应仅含 libwebkitgtk-6.0.so.4，无 aarch64/musl/perl）=="; rpm -qp --requires artifacts/${{ matrix.rid }}/*.rpm 2>&1 | head -60 || rpm -qp --requires artifacts/${{ matrix.rid }}/rpmbuild/RPMS/**/*.rpm 2>&1 | head -60 || true
          echo "== 产物清单 =="; ls -lh artifacts/${{ matrix.rid }}/*.deb artifacts/${{ matrix.rid }}/*.rpm artifacts/${{ matrix.rid }}/rpmbuild/RPMS/**/*.rpm 2>&1 | head -40 || true

      - name: 上传预览/发布产物（7 天，与 pilot-harness pilot-harness-* 一致） 
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          path: |
            artifacts/${{ matrix.rid }}/*.deb
            artifacts/${{ matrix.rid }}/*.rpm
            artifacts/${{ matrix.rid }}/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 7
