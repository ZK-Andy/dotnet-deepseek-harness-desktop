name: package

# 三平台打包的唯一家（linux / macos / windows 三条腿同文件）。
#   - `workflow_call`：release.yml 在 tag 发布时调用，三条腿与发布作业同 run。
#   - `workflow_dispatch`：单跑预览，只出包 + 上传 7 天 Artifacts（artifact 按 run 隔离，
#     别处取不到；**发布入口只有 release.yml**——在 tag ref 上单跑本 workflow 不产 Release）。
#   - 本地不产包：所有产物来自 GitHub-hosted runner（dpkg-deb/rpmbuild、hdiutil、Inno Setup）。
# 资产命名矩阵（`linux-{amd64,arm64}-packages` 等 artifact 名与其内文件名）是
# `scripts/release-preflight.sh` 的契约。

on:
  workflow_call:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag ref 取 tag）'
        required: false
        default: ''
        type: string
      self_sign:
        description: '自签（仅内部/开发验证；对终端用户 Gatekeeper/SmartScreen 无效）'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag ref 取 tag）'
        required: false
        default: ''
        type: string
      self_sign:
        description: '自签（仅内部/开发验证；对终端用户 Gatekeeper/SmartScreen 无效）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

# 组名三段各有作用、**别删任一段**（机制推演见 ADR ci-package-workflow-unification；
# 组名解析与 cancel 生效面只有真 runner 能实证，本批为文档+推演结论）：
# 被调用执行时 `github.workflow` 取**调用方**名，故**事件段**把被调用腿与调用方自组分开
# （删掉即同组，两侧 `cancel-in-progress` 相反即死锁 `Canceling since a deadlock for
# concurrency group`）；**workflow 名段**把被调用腿与「手动 dispatch 本 workflow 的预览轮」
# 分开（否则后者的 cancel 会掐掉前者正在跑的发布作业）。`cancel-in-progress` 只在事件为
# `workflow_dispatch` 时为 true。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-linux:
    # 两腿是独立平台，一腿失败不连坐另一腿（fail-fast=false）：首跑 arm64 rpm 冒烟
    # 抓到 EOL F41 缺 webkitgtk6.0 时，x64 的对照证据被取消掩埋。
    # arm64 腿的前提：Ryn.Interop 供给 runtimes/linux-arm64/native（ADR artifact-verification-chain）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runs-on: ubuntu-latest
          - arch: arm64
            rid: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # 顺序硬约束：本地 action 的 `action.yml` 在该 step **自己开跑时**才从工作区读
      # （runner 的 job 准备阶段对 `./` 自仓 action 是显式跳过的），所以同 job 里必须有一条
      # 更早的 checkout——把 checkout 收进 composite 内，读 `action.yml` 时工作区仍是空的，
      # 报 `Can't find 'action.yml' … Did you forget to run actions/checkout …`。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-setup
        with:
          version: ${{ inputs.version }}
          setup-node: 'true'

      - name: 安装 rpmbuild 与冒烟显示栈（xvfb + 截图 + 会话总线）
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb scrot dbus imagemagick

      - name: dotnet publish（自包含 JIT，对齐 pilot-harness 打包前 build）
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:Version="$VERSION" -o artifacts/publish-${{ matrix.rid }}

      - name: 打 Linux 安装包（deb + rpm，参照 pilot-harness electron-builder 的 linux 产物）
        run: bash scripts/package-linux.sh artifacts/publish-${{ matrix.rid }}

      - name: 包内容布局断言（staging 即安装包唯一内容源，与 win/mac 腿同款判据）
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-package-layout.sh --platform linux \
            --target "artifacts/${{ matrix.rid }}/stage/deepseek-harness-desktop-$VERSION/usr/lib/deepseek-harness-desktop"

      - name: 包可解析断言 + 打包取证（deb control / rpm Requires 留痕，人眼复核）
        shell: bash
        run: |
          set -euo pipefail
          # 真断言：产物必须能被各自的包工具解析（`|| true` 会把这一步变成永不失败的门）。
          # 不带管道——`| head` 下生产者收 SIGPIPE(141)，pipefail 会把留痕行变成红。
          dpkg-deb -I artifacts/${{ matrix.rid }}/*.deb > /dev/null
          rpm -qp --requires artifacts/${{ matrix.rid }}/*.rpm > /dev/null
          # 留痕（不判门）：rpm Requires 应仅含 libwebkitgtk-6.0.so.4 与 libadwaita-1.so.0、
          # 无 aarch64/musl/perl 假依赖——该不变量无机械断言，偏差靠这里的人眼复核。
          echo "== deb control =="; dpkg-deb -I artifacts/${{ matrix.rid }}/*.deb 2>&1 | head -40 || true
          echo "== rpm Requires =="; rpm -qp --requires artifacts/${{ matrix.rid }}/*.rpm 2>&1 | head -60 || true
          echo "== 产物清单 =="; ls -lh artifacts/${{ matrix.rid }}/*.deb artifacts/${{ matrix.rid }}/*.rpm

      - name: 安装冒烟（装包→首启引导→等 dsh web URL 行，Xvfb 虚拟显示下跑全链）
        id: smoke
        shell: bash
        env:
          SMOKE_SHOT_DIR: ${{ github.workspace }}/smoke-shots
          # CI 逃生舱（ADR webkit-sandbox-userns-fallback）：runner 无特权 userns，bwrap 沙箱必 core；
          # 产品侧条件降级在 runner 上同样命中（sysctl 阳性，日志有禁用行），CI 显式设与产品行为一致。
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          # 软件渲染（Xvfb 无 DRI3 加速，DRI3 warning 后窗口在 dsh 就位前消失；纯 CI 取证，不动产品）：
          # 关 WebKit 合成 + 强制 Mesa 软渲染，看窗口能否存活到 dsh 就位、页面出像素。
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          # W2 落盘：冒烟日志（stdout 全量 + host.log）进稳定目录，CI 传 artifact（step 日志只有尾巴）。
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" bash scripts/smoke-install-linux.sh artifacts/${{ matrix.rid }}

      # 证据缺失分档：冒烟**跑过且失败**（含停滞/超时红）时证据缺失 = 尸检材料丢了，判 error；
      # 其余情形（冒烟绿、或被前置步失败跳过而未跑）判 warn——跳过时真因在别处，不该再添一条
      # 无证据的红来掩埋它。warn 恒定的上传步等于永不失败的门。
      - name: 上传冒烟截图（best-effort，Xvfb 下真实开火，无显示回退时空过，人眼复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shot-linux-${{ matrix.arch }}
          path: ${{ github.workspace }}/smoke-shots/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传冒烟日志（W2：stdout 全量 + host.log，超时/停滞尸检用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-linux-${{ matrix.arch }}
          path: ${{ github.workspace }}/smoke-logs/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传预览/发布产物（7 天，与 pilot-harness pilot-harness-* 一致）
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          # 只传顶层包：package-linux.sh 已把 rpm mv 到顶层，嵌套 rpmbuild 目录不留副本
          # （否则顶层 + 嵌套同名 rpm 双份进 Release）
          path: |
            artifacts/${{ matrix.rid }}/*.deb
            artifacts/${{ matrix.rid }}/*.rpm
          if-no-files-found: error
          retention-days: 7

  build-macos:
    # 参照 Ryn 的 release.yml：每个 RID 在原生 OS 上构建；本仓发布为 JIT
    # （csproj PublishAot=false）可交叉编，故两档均用 macos-latest 单 runner 矩阵内切 rid，
    # 避免占 2 台 mac（原 x64 用 macos-13 已排队 9m+，现 ARM via Rosetta 交叉编）。
    # fail-fast=false（与 linux 腿同款）：一腿红不连坐另一腿——x64 病 runner 抖动时也保住 arm64 的 verdict/像素证据。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
          - arch: x64
            rid: osx-x64
    runs-on: macos-latest
    env:
      ARCH: ${{ matrix.arch }}
      # 打包脚本的自签门是 `SELF_SIGN=1`，而 boolean 输入插值出来是 true/false——
      # 直接透传会让旋钮恒不生效
      SELF_SIGN: ${{ inputs.self_sign && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-setup
        with:
          version: ${{ inputs.version }}

      - name: dotnet publish
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:Version="$VERSION" -o artifacts/publish-${{ matrix.rid }}

      - name: 载荷冒烟探针（publish 产物 native 面：FFI 加载/导出、图像解码、PTY）
        timeout-minutes: 5
        run: |
          dotnet publish tools/DeepSeek.Harness.Desktop.PayloadSmoke -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/payload-smoke-${{ matrix.rid }}
          artifacts/payload-smoke-${{ matrix.rid }}/DeepSeek.Harness.Desktop.PayloadSmoke artifacts/publish-${{ matrix.rid }}

      - name: 打 macOS 包（dmg，文件名含 macos 标识；不产独立 zip）
        run: bash scripts/package-macos.sh artifacts/publish-${{ matrix.rid }}

      - name: 校验最终 dmg 内容（挂载断言布局与随包插件一致性）
        run: |
          set -euo pipefail
          DMG="$(ls artifacts/${{ matrix.rid }}/*.dmg)"
          MNT="$(mktemp -d)/mnt"
          mkdir -p "$MNT"
          # 断言失败也要卸载：trap 兜底 detach，失败路径不留挂载点给同 job 后续步骤
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          bash scripts/verify-package-layout.sh --platform macos --target "$MNT/DeepSeek.Harness.Desktop.app/Contents/MacOS"
          hdiutil detach "$MNT"

      - name: 安装截图见证工具（截图内容判定：convert，中央裁剪口径）
        run: brew install imagemagick

      - name: 安装冒烟（挂载→拷入 /Applications→启动→等 dsh web URL 行或引导启动行）
        id: smoke
        env:
          SMOKE_SHOT_DIR: ${{ github.workspace }}/smoke-shots
          # W2 落盘：冒烟日志（stdout 全量 + host.log）进稳定目录，CI 传 artifact。
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
        run: bash scripts/smoke-install-macos.sh "$(ls artifacts/${{ matrix.rid }}/*.dmg | head -1)"

      # 证据缺失分档（与 linux 腿同款）：冒烟跑过且失败时判 error，其余（冒烟绿、或
      # 被前置步失败跳过）判 warn——warn 恒定的上传步等于永不失败的门。
      - name: 上传冒烟截图（best-effort，人眼复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shot-macos-${{ matrix.arch }}
          path: ${{ github.workspace }}/smoke-shots/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传冒烟日志（W2：stdout 全量 + host.log，超时/停滞尸检用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-macos-${{ matrix.arch }}
          path: ${{ github.workspace }}/smoke-logs/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-packages
          path: |
            artifacts/${{ matrix.rid }}/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    env:
      ARCH: x64
      # 同 macos 腿：自签门是 `SELF_SIGN=1`，boolean 输入须映射成 1/0
      SELF_SIGN: ${{ inputs.self_sign && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-setup
        with:
          version: ${{ inputs.version }}

      - name: dotnet publish
        shell: bash
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r win-x64 --self-contained true -p:Version="$VERSION" -o artifacts/publish-win-x64

      - name: 载荷冒烟探针（publish 产物 native 面：FFI 加载/导出、图像解码、ConPTY）
        shell: bash
        timeout-minutes: 5
        run: |
          dotnet publish tools/DeepSeek.Harness.Desktop.PayloadSmoke -c Release -r win-x64 --self-contained true -o artifacts/payload-smoke
          artifacts/payload-smoke/DeepSeek.Harness.Desktop.PayloadSmoke.exe artifacts/publish-win-x64

      - name: 打 Windows 包（安装器 exe，文件名含 windows 标识；不产独立 zip）
        shell: bash
        run: bash scripts/package-windows.sh artifacts/publish-win-x64

      - name: 安装器内容断言（staging 即安装器唯一内容源，防 Inno [Files] 漏配）
        shell: bash
        run: bash scripts/verify-package-layout.sh --platform windows --target artifacts/win-x64/stage/DeepSeek.Harness.Desktop

      # 解析 dsh 跟版线当前版本，供 npm 缓存键「跟版」。规格单一来源 = appsettings.json 的
      # DshSpec（不在工作流里复写通道名）。解析失败**不判门**（留 `::warning::` 可见），此时键
      # 退化为常量后缀 `unknown`：本次仍由 `restore-keys` 命中旧条目，但该键一旦建立就不再更新
      # ——即退化成「常量键→条目永久冻结」形态，直到解析恢复。
      - name: 解析 dsh 跟版线版本（npm 缓存键跟版）
        shell: bash
        run: |
          set -euo pipefail
          SPEC="$(node -e "process.stdout.write(require('./src/DeepSeek.Harness.Desktop/appsettings.json').RuntimeBootstrap.DshSpec)" 2>/dev/null || true)"
          V="$(npm view --loglevel=error "$SPEC" version 2>/dev/null | tail -n 1 || true)"
          if [[ ! "$V" =~ ^[0-9] ]]; then
            echo "::warning::dsh 跟版线版本解析失败（spec='${SPEC}'，观测值='${V}'），npm 缓存键退化为常量后缀"
            V="unknown"
          fi
          echo "DSH_CACHE_KEY=npm-cache-windows-x64-dsh-${V}" >> "$GITHUB_ENV"
          echo "dsh 跟版线 ${SPEC} → ${V}"

      - name: 缓存 npm 下载缓存（只缓存 cacache 下载内容，不缓存 %APPDATA%\npm 安装树——首启冷装路径仍被真实演练）
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/npm-cache
          # 键带**运行时解析**的 dsh 跟版线版本：通道是移动靶（现 `@next`），仓库侧没有能表征它的
          # 输入——hash 一个不存在的路径只会得到一个假 hash，故在 job 内解析一次再组键。
          # 缓存陈旧只意味着命中率下降，不会陈旧产物（cacache 按内容寻址）。
          # `restore-keys` 前缀回退随键跟版才有意义：上游换版时精确键 miss，退到最近创建的条目
          # （未变依赖的 tarball 仍复用）并在 job 末存下新键；该前缀同时命中更早的常量键条目。
          key: ${{ env.DSH_CACHE_KEY }}
          restore-keys: npm-cache-windows-x64

      # 冒烟腿的 runner 前置（唯一家 = scripts/prepare-windows-smoke.sh）：
      #   WebView2 先探后装——镜像自带运行时（注册表 pv 命中）即跳过 Evergreen 的下载+静默安装
      #   （读数见 ADR process/2026-10-01-windows-smoke-npm-install-speedup）；未注册才装，失败
      #   fail loud。目录枚举与 pv 只留痕，不判门。
      - name: 冒烟前置（WebView2 先探后装）
        shell: bash
        run: bash scripts/prepare-windows-smoke.sh

      - name: 安装冒烟（静默安装→启动→等 dsh web URL 行或引导启动行）
        id: smoke
        shell: bash
        env:
          SMOKE_SHOT_DIR: ${{ github.workspace }}/smoke-shots
          # W2 落盘：冒烟日志（stdout 全量 + host.log）进稳定目录，CI 传 artifact。
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
        run: bash scripts/smoke-install-windows.sh "$(ls artifacts/win-x64/*-setup.exe | head -1)"

      # 证据缺失分档（与 linux 腿同款）：冒烟跑过且失败时判 error，其余（冒烟绿、或
      # 被前置步失败跳过）判 warn——warn 恒定的上传步等于永不失败的门。本腿绿＝含「安装链
      # 兜底 PASS」（无桌面会话时截图本就静默跳过），故这条分档尤其不能对绿跑要证据。
      - name: 上传冒烟截图（best-effort，人眼复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shot-windows-x64
          path: ${{ github.workspace }}/smoke-shots/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传冒烟日志（W2：stdout 全量 + host.log，超时/停滞尸检用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-windows-x64
          path: ${{ github.workspace }}/smoke-logs/
          if-no-files-found: ${{ steps.smoke.outcome == 'failure' && 'error' || 'warn' }}
          retention-days: 7

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            artifacts/win-x64/*.exe
          if-no-files-found: error
          retention-days: 7
