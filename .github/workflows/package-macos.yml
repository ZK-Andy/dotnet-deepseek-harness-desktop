name: package-macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（留空自动取 csproj <Version>；tag 触发取 tag；填 v0.1.3 亦可）'
        required: false
        default: ''
      self_sign:
        description: '自签 codesign（仅内部/开发验证；对终端用户 Gatekeeper 无效）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    # 参照 Ryn 的 release.yml：每个 RID 在原生 OS 上构建；
    # 本项目发布为 JIT（csproj PublishAot=false）可交叉编，故两档均用 macos-latest 单 runner 矩阵内切 rid，
    # 避免占 2 台 mac（原 x64 用 macos-13 已排队 9m+，现 ARM via Rosetta 交叉编）
    strategy:
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
          - arch: x64
            rid: osx-x64
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: ${{ matrix.arch }}
      SELF_SIGN: ${{ github.event.inputs.self_sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 确定版本
        shell: bash
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          # 输入留空时回退 csproj <Version>（版本单一来源；空值会令 -p:Version= 触发 MSB4044，前置 fail loud）
          if [[ -z "$V" ]]; then
            V="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/DeepSeek.Harness.Desktop/DeepSeek.Harness.Desktop.csproj | head -1)"
          fi
          if [[ -z "$V" ]]; then
            echo "::error::无法确定打包版本：tag 无版本、输入为空且 csproj 无 <Version>"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "打包版本: $V (ref=${{ github.ref }} event=${{ github.event_name }}) arch=${{ matrix.arch }} rid=${{ matrix.rid }}"
      - name: dotnet publish
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ env.VERSION }} -o artifacts/publish-${{ matrix.rid }}
      - name: 打 macOS 包（dmg，文件名含 macos 标识；不再产独立 zip）
        run: bash scripts/package-macos.sh artifacts/publish-${{ matrix.rid }}
      - name: 校验最终 dmg 内容（挂载断言布局与随包插件一致性，批次一）
        run: |
          set -euo pipefail
          DMG="$(ls artifacts/${{ matrix.rid }}/*.dmg)"
          MNT="$(mktemp -d)/mnt"
          mkdir -p "$MNT"
          # 断言失败也要卸载：trap 兜底 detach，失败路径不留挂载点给同 job 后续步骤
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          bash scripts/verify-package-layout.sh --target "$MNT/DeepSeek.Harness.Desktop.app/Contents/MacOS"
          hdiutil detach "$MNT"
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-packages
          path: |
            artifacts/${{ matrix.rid }}/*.dmg
          if-no-files-found: error
          retention-days: 7
