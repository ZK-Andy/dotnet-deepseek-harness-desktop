name: package-macos

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '包版本'
        required: false
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
            runs-on: macos-latest
          - arch: x64
            rid: osx-x64
            runs-on: macos-13
    runs-on: ${{ matrix.runs-on }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-v1
          restore-keys: pnpm-store-v1
      - name: 生成捆绑运行时
        run: bash scripts/bundle-runtime-ci.sh ${{ matrix.rid }}
      - name: 确定版本
        shell: bash
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: dotnet publish
        run: dotnet publish src/DeepSeek.Harness.Desktop -c Release -r ${{ matrix.rid }} -p:PublishAot=false --self-contained true -o artifacts/publish-${{ matrix.rid }}
      - name: 打 macOS 包（zip）
        run: bash scripts/package-macos.sh artifacts/publish-${{ matrix.rid }}
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-packages
          path: artifacts/${{ matrix.rid }}/*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-packages
          path: release-assets
          merge-multiple: true
      - name: 生成 SHA256SUMS
        run: |
          (cd release-assets && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > release-assets/SHA256SUMS-macos.txt
          cat release-assets/SHA256SUMS-macos.txt
      - name: 发布 Release（macOS）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            release-assets/**/*.zip
            release-assets/SHA256SUMS-macos.txt
